name: Build Custom Dylib

on:
  workflow_dispatch:
  push:
    paths:
      - 'SideloadFix/**'
      - '.github/workflows/build-dylib.yml'

jobs:
  build-dylib:
    name: Build iOS Sideload Fix Dylibs
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile FixTelegram.dylib & SideloadFix.dylib
        run: |
          mkdir -p build-output
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)
          echo "Using iOS SDK at: $SDK_PATH"

          # 1. Compile FixTelegram.dylib
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=14.0 \
            -framework Foundation -framework Security \
            -install_name @rpath/FixTelegram.dylib \
            SideloadFix/FixTelegram.m SideloadFix/fishhook.c \
            -o build-output/FixTelegram.dylib

          # 2. Compile SideloadFix.dylib (alternative name for universal compatibility)
          xcrun -sdk iphoneos clang -arch arm64 -dynamiclib -fobjc-arc \
            -isysroot "$SDK_PATH" \
            -miphoneos-version-min=14.0 \
            -framework Foundation -framework Security \
            -install_name @rpath/SideloadFix.dylib \
            SideloadFix/FixTelegram.m SideloadFix/fishhook.c \
            -o build-output/SideloadFix.dylib

      - name: Verify Binary Architecture & Dependencies
        run: |
          echo "=== File Info ==="
          file build-output/*.dylib
          echo "=== Mach-O Load Commands (FixTelegram.dylib) ==="
          otool -L build-output/FixTelegram.dylib
          echo "=== Mach-O Load Commands (SideloadFix.dylib) ==="
          otool -L build-output/SideloadFix.dylib

      - name: Upload Dylib Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FixTelegram-dylib
          path: build-output/*.dylib
          if-no-files-found: error
